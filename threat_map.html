const COLORS = {
    critical: '#e11d48',
    high: '#f97316',
    medium: '#eab308',
    low: '#22c55e'
};


function getElement(id) {
    return document.getElementById(id);
}


const map = L.map(
    'map',
    {worldCopyJump: false, maxBounds: [[-85, -180], [85, 180]], maxBoundsViscosity: 1.0, minZoom: 2}
).setView(
    [20, 0],
    2
);


const street = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 18,
        noWrap: true
    }
).addTo(map);


const lightGray = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 16,
        noWrap: true
    }
);


const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 18,
        noWrap: true
    }
);


const openStreetMap = L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
        noWrap: true
    }
);

// Transparent reference layer for country/state/place names.
// This is especially useful on the satellite view, where labels are not built into the imagery.
const placeLabels = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Reference_Overlay/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Labels &copy; Esri',
        maxZoom: 18,
        noWrap: true,
        opacity: 0.95
    }
).addTo(map);


L.control.layers(
    {
        'Street (Esri)': street,
        'Light gray (Esri)': lightGray,
        'Satellite (Esri)': satellite,
        'OpenStreetMap': openStreetMap
    },
    {
        'State / Place Names': placeLabels
    },
    null,
    {
        position: 'bottomleft'
    }
).addTo(map);


// Marker clustering prevents hundreds of nearby IPs from appearing as repeated/overlapping markers.
const markers = L.markerClusterGroup({
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    removeOutsideVisibleBounds: true,
    maxClusterRadius: 45
});

map.addLayer(markers);


const countries = [];


for (let i = 0; i < DATA.length; i++) {

    if (!countries.includes(DATA[i].country)) {
        countries.push(DATA[i].country);
    }

}


countries.sort();


for (let i = 0; i < countries.length; i++) {

    const option = document.createElement('option');

    option.value = countries[i];

    option.textContent = countries[i];

    getElement('country').appendChild(option);

}


function makePopup(point) {

    const locationText = [
        point.locality,
        point.region_name,
        point.region_code,
        point.country,
        point.postalcode
    ].filter(Boolean).join(', ');

    const providerText = [
        point.isp,
        point.org
    ].filter(Boolean).join(' | ');

    return `
        <div style="min-width:260px; line-height:1.5;">
        <b style="font-size:16px;">${point.ip}</b>
        <hr style="margin:5px 0;">
        <b>Location:</b> ${locationText || 'Unknown'}<br>
        <b>Coordinates:</b> ${Number(point.lat).toFixed(4)}, ${Number(point.lon).toFixed(4)}<br>
        <b>Risk:</b> ${point.risk} (${point.severity})<br>
        <b>Events:</b> ${point.events}<br>
        <b>Unique ports:</b> ${point.ports}<br>
        <b>Main target:</b> ${point.service || 'unknown'}<br>
        ${providerText ? '<b>ISP / Organization:</b> ' + providerText + '<br>' : ''}
        ${point.timezone ? '<b>Timezone:</b> ' + point.timezone + '<br>' : ''}
        ${point.seen !== undefined ? '<b>Honeypot status:</b> ' + (point.seen ? 'Seen' : 'Not seen - estimate') : ''}
        </div>
    `;

}


async function searchIP() {

    const input = getElement('q');
    const ip = input.value.trim();

    if (!ip) {
        getElement('result').textContent = 'Please enter an IP address.';
        return;
    }

    // First check the IPs already stored in the dashboard.
    let point = null;

    for (let i = 0; i < DATA.length; i++) {
        if (DATA[i].ip === ip) {
            point = DATA[i];
            break;
        }
    }

    // If the IP is not in the dashboard, ask Python through the local server.
    if (!point) {

        getElement('result').textContent = 'Analysing ' + ip + ' ...';

        try {

            const response = await fetch(
                '/api/analyze?ip=' + encodeURIComponent(ip)
            );

            const result = await response.json();

            if (result.error) {
                getElement('result').textContent = result.error;
                return;
            }

            point = {
                ip: result.ip,
                lat: result.lat,
                lon: result.lon,
                country: result.country || 'Unknown',
                locality: result.locality || '',
                region_name: result.region_name || '',
                region_code: result.region_code || '',
                postalcode: result.postalcode || '',
                isp: result.isp || '',
                org: result.org || '',
                timezone: result.timezone || '',
                seen: result.seen,
                risk: Number(result.risk || 0),
                severity: result.severity || 'low',
                events: result.events || 0,
                ports: result.ports || 0,
                service: result.service || 'Unknown'
            };

        } catch (error) {

            getElement('result').innerHTML =
                '<b>New-IP search needs the notebook server.</b><br>' +
                'Open the Dashboard address printed by the notebook, ' +
                'such as http://127.0.0.1:8765/, and keep Jupyter running.';
            return;
        }
    }

    // Show the result.
    getElement('result').innerHTML =
        '<b>' + point.severity.toUpperCase() + '</b>' +
        ' &nbsp; Risk: <b>' + Number(point.risk).toFixed(3) + '</b><br>' +
        'IP: ' + point.ip + '<br>' +
        'Location: ' + [point.locality, point.region_name, point.region_code, point.country, point.postalcode].filter(Boolean).join(', ') + '<br>' +
        'Coordinates: ' + Number(point.lat).toFixed(4) + ', ' + Number(point.lon).toFixed(4) + '<br>' +
        'Events: ' + point.events + '<br>' +
        'Ports: ' + point.ports + '<br>' +
        'Main target: ' + point.service + '<br>' +
        (point.isp ? 'ISP: ' + point.isp + '<br>' : '') +
        (point.org ? 'Organization: ' + point.org : '');

    // Move the map to the searched IP if coordinates are available.
    if (point.lat !== null && point.lon !== null &&
        point.lat !== undefined && point.lon !== undefined) {

        L.marker([point.lat, point.lon])
            .addTo(map)
            .bindPopup(makePopup(point))
            .openPopup();

        map.flyTo([point.lat, point.lon], 5);
    }
}


// Enter key support.
getElement('q').addEventListener(
    'keydown',
    function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            searchIP();
        }
    }
);


// Search button support.
getElement('searchBtn').addEventListener(
    'click',
    searchIP
);


function drawMarkers() {

    markers.clearLayers();


    const minimumRisk =
        Number(getElement('risk').value);


    const selectedCountry =
        getElement('country').value;


    const selectedSeverity = {};


    const checkboxes =
        document.querySelectorAll('.sev');


    for (let i = 0; i < checkboxes.length; i++) {

        selectedSeverity[
            checkboxes[i].value
        ] = checkboxes[i].checked;

    }


    let shown = 0;


    for (let i = 0; i < DATA.length; i++) {

        const point = DATA[i];


        if (point.risk < minimumRisk) {
            continue;
        }


        if (
            selectedCountry &&
            point.country !== selectedCountry
        ) {
            continue;
        }


        if (
            !selectedSeverity[
                point.severity
            ]
        ) {
            continue;
        }


        shown++;


        L.circleMarker(
            [point.lat, point.lon],
            {
                radius: 4 + point.risk * 5,
                color: COLORS[point.severity],
                fillColor: COLORS[point.severity],
                fillOpacity: 0.6,
                weight: 1
            }
        )
        .bindPopup(
            makePopup(point)
        )
        .addTo(markers);

    }


    getElement('count').textContent =
        shown + ' IPs shown';


    getElement('rv').textContent =
        minimumRisk.toFixed(3);

}


getElement('risk').addEventListener(
    'input',
    drawMarkers
);


getElement('country').addEventListener(
    'change',
    drawMarkers
);


const severityBoxes =
    document.querySelectorAll('.sev');


for (let i = 0; i < severityBoxes.length; i++) {

    severityBoxes[i].addEventListener(
        'change',
        drawMarkers
    );

}


drawMarkers();


</script>
